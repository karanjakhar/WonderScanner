<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WonderScanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;700;800&display=swap');
      
      body {
        font-family: 'Nunito', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        overflow-x: hidden;
      }
      
      .font-display {
        font-family: 'Fredoka', sans-serif;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      
      @keyframes wiggle {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        80% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes bounce-gentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      /* Sound Wave Animation */
      @keyframes wave {
        0%, 100% { height: 20%; transform: scaleY(1); }
        50% { height: 100%; transform: scaleY(1.2); }
      }

      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-delayed { animation: float 7s ease-in-out infinite 2s; }
      .animate-wiggle { animation: wiggle 2s ease-in-out infinite; }
      .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .animate-bounce-gentle { animation: bounce-gentle 3s ease-in-out infinite; }
      .animate-wave { animation: wave 1s ease-in-out infinite; }

      /* Utility for staggered animations */
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      
      /* 3D Button Press Effect */
      .btn-3d {
        transition: all 0.1s;
        transform: translateY(0);
        box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      }
      .btn-3d:active {
        transform: translateY(6px);
        box-shadow: 0 0 0 rgba(0,0,0,0.2);
      }
    </style>

    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
